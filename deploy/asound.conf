# ALSA configuration for Sonnette on RK3506
#
# The RK3506 SAI1 (speaker) only accepts 2 channels.
# pjsua outputs mono. Without this config, mono playback is broken
# ("helium" pitch shift due to broken implicit plug conversion).
#
# speaker_dup: duplicates mono input to both L and R channels.
# default: asymmetric — capture from PDM (stereo), playback via speaker_dup.
#
# Install: cp asound.conf /etc/asound.conf

pcm.speaker_dup {
    type route
    slave {
        pcm "hw:1,0"
        channels 2
    }
    ttable.0.0 1.0
    ttable.0.1 1.0
}

pcm.!default {
    type asym
    capture.pcm "hw:0,0"
    playback.pcm "speaker_dup"
}
